# clang-tidy query check (lane C17 pitch sweep): pointer arithmetic whose offset is an unsigned
# 32-bit expression with a signed operand. VC6's 32-bit pointers wrap a negative offset back;
# LP64/LLP64 zero-extends it. Run over a configured native build (README "Pointer offsets"):
#   clang-tidy --experimental-custom-checks --config-file=native/tools/pitch_wrap_check.yaml -p <build> <files>
# (llvm-mingw's clang-tidy 23 has query-based checks; add -isysroot $(xcrun --show-sdk-path) on macOS).
Checks: '-*,custom-*'
CustomChecks:
  - Name: pitch-wrap
    Query: |
      let off expr(hasType(hasCanonicalType(asString("unsigned int"))), hasDescendant(implicitCastExpr(hasImplicitDestinationType(hasCanonicalType(asString("unsigned int"))), hasSourceExpression(expr(hasType(isSignedInteger()))))))
      match expr(anyOf(binaryOperator(hasAnyOperatorName("+", "-", "+=", "-="), hasEitherOperand(hasType(pointerType())), hasEitherOperand(ignoringParenImpCasts(off))), arraySubscriptExpr(hasIndex(ignoringParenImpCasts(off))))).bind("x")
    Diagnostic:
      - BindName: x
        Message: "pointer offset in unsigned 32-bit arithmetic with a signed operand (wraps on VC6, not on 64-bit)"
        Level: Warning
